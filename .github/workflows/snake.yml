name: snake
on:
  schedule:
    - cron: "0 0 * * *"   
  workflow_dispatch:       
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-red.svg?color_snake=#ff1a1a&color_dots=#161b22,#4a0000,#800000,#b30000,#ff1a1a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
